basePath: /
definitions:
  request.CompanyCreateRequest:
    properties:
      address:
        type: string
      currency:
        maxLength: 10
        type: string
      email:
        maxLength: 150
        type: string
      industry:
        maxLength: 100
        type: string
      legal_name:
        maxLength: 200
        type: string
      name:
        maxLength: 150
        minLength: 1
        type: string
      phone:
        maxLength: 30
        type: string
      tax_id:
        maxLength: 50
        type: string
    required:
    - name
    type: object
  request.CustomerCreateRequest:
    properties:
      address:
        type: string
      coa_id:
        type: string
      code:
        maxLength: 20
        minLength: 1
        type: string
      email:
        type: string
      name:
        minLength: 1
        type: string
      phone:
        type: string
    required:
    - code
    - name
    type: object
  request.CustomerUpdateRequest:
    properties:
      address:
        type: string
      coa_id:
        type: string
      code:
        maxLength: 20
        minLength: 1
        type: string
      email:
        type: string
      name:
        minLength: 1
        type: string
      phone:
        type: string
    required:
    - code
    - name
    type: object
  request.FiscalPeriodReopenRequest:
    properties:
      id:
        type: string
      reason:
        minLength: 10
        type: string
    required:
    - reason
    type: object
  request.FiscalYearCreateRequest:
    properties:
      end_date:
        description: YYYY-MM-DD
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      period_type:
        enum:
        - monthly
        - quarterly
        - custom
        type: string
      start_date:
        description: YYYY-MM-DD
        type: string
      stub_start_date:
        description: |-
          StubStartDate is optional. If provided, the first period will start from this
          date instead of the fiscal year start_date. Used when onboarding mid-period.
        type: string
    required:
    - end_date
    - name
    - period_type
    - start_date
    type: object
  request.FiscalYearUpdateRequest:
    properties:
      id:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  request.LoginRequest:
    properties:
      email:
        example: johndoe@example.com
        maxLength: 254
        minLength: 1
        type: string
      password:
        example: yoursecretpassword
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  request.UserCreateRequest:
    properties:
      email:
        minLength: 1
        type: string
      name:
        minLength: 1
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 20
        minLength: 1
        type: string
    required:
    - email
    - name
    - password
    - username
    type: object
  request.UserUpdateRequest:
    properties:
      email:
        minLength: 1
        type: string
      id:
        type: string
      name:
        maxLength: 20
        minLength: 1
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 20
        minLength: 1
        type: string
    required:
    - email
    - name
    - username
    type: object
  request.VendorCreateRequest:
    properties:
      address:
        type: string
      coa_id:
        type: string
      code:
        maxLength: 20
        minLength: 1
        type: string
      email:
        type: string
      name:
        minLength: 1
        type: string
      phone:
        type: string
    required:
    - code
    - name
    type: object
  request.VendorUpdateRequest:
    properties:
      address:
        type: string
      coa_id:
        type: string
      code:
        maxLength: 20
        minLength: 1
        type: string
      email:
        type: string
      name:
        minLength: 1
        type: string
      phone:
        type: string
    required:
    - code
    - name
    type: object
  response.AuthJSON:
    properties:
      access_token:
        type: string
      message:
        type: string
      status:
        type: integer
      user:
        $ref: '#/definitions/response.UserInfo'
    type: object
  response.JSON:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/response.Meta'
      status:
        type: integer
    type: object
  response.Links:
    properties:
      current_page:
        type: string
      first_page:
        type: string
      last_page:
        type: string
      next_page:
        type: string
      prev_page:
        type: string
    type: object
  response.Meta:
    properties:
      info:
        type: string
      links:
        $ref: '#/definitions/response.Links'
      page:
        type: integer
      page_size:
        type: integer
      search:
        type: string
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
  response.SelectJSON:
    properties:
      data: {}
    type: object
  response.UserInfo:
    properties:
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
      status:
        type: integer
      username:
        type: string
    type: object
host: 127.0.0.1:3000
info:
  contact:
    email: fatihrizqon@gmail.com
    name: Fatih Rizqon
  description: This is an Official Documentation for Go REST API with Fiber Framework
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Go REST API with Fiber Framework
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return a JWT token in a cookie
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AuthJSON'
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/response.JSON'
        "401":
          description: Authentication failed
          schema:
            $ref: '#/definitions/response.JSON'
      summary: User login
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Logout user, blacklist refresh token, clear cookie
      responses:
        "200":
          description: Successfully logged out
          schema:
            $ref: '#/definitions/response.JSON'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.JSON'
      summary: Logout user
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: Generate new access token and rotate refresh token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AuthJSON'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.JSON'
      summary: Refresh access token
      tags:
      - Auth
