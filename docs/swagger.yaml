basePath: /
definitions:
  request.COACreateRequest:
    properties:
      code:
        minLength: 1
        type: string
      name:
        minLength: 1
        type: string
      subgroup_id:
        type: string
    required:
    - code
    - name
    - subgroup_id
    type: object
  request.COAGroupCreateRequest:
    properties:
      code:
        minLength: 1
        type: string
      name:
        minLength: 1
        type: string
      normal_balance:
        minLength: 1
        type: string
    required:
    - code
    - name
    - normal_balance
    type: object
  request.COAGroupUpdateRequest:
    properties:
      code:
        maxLength: 20
        minLength: 1
        type: string
      id:
        type: string
      name:
        maxLength: 20
        minLength: 1
        type: string
      normal_balance:
        minLength: 1
        type: string
    required:
    - code
    - name
    - normal_balance
    type: object
  request.COASubGroupCreateRequest:
    properties:
      code:
        minLength: 1
        type: string
      group_id:
        type: string
      name:
        minLength: 1
        type: string
    required:
    - code
    - group_id
    - name
    type: object
  request.COASubGroupUpdateRequest:
    properties:
      code:
        maxLength: 20
        minLength: 1
        type: string
      group_id:
        type: string
      id:
        type: string
      name:
        maxLength: 20
        minLength: 1
        type: string
    required:
    - code
    - group_id
    - name
    type: object
  request.COAUpdateRequest:
    properties:
      code:
        maxLength: 20
        minLength: 1
        type: string
      id:
        type: string
      name:
        maxLength: 20
        minLength: 1
        type: string
      subgroup_id:
        type: string
    required:
    - code
    - name
    - subgroup_id
    type: object
  request.CustomerCreateRequest:
    properties:
      address:
        type: string
      coa_id:
        type: string
      code:
        maxLength: 20
        minLength: 1
        type: string
      email:
        type: string
      name:
        minLength: 1
        type: string
      phone:
        type: string
    required:
    - code
    - name
    type: object
  request.CustomerUpdateRequest:
    properties:
      address:
        type: string
      coa_id:
        type: string
      code:
        maxLength: 20
        minLength: 1
        type: string
      email:
        type: string
      name:
        minLength: 1
        type: string
      phone:
        type: string
    required:
    - code
    - name
    type: object
  request.JournalEntryCreateRequest:
    properties:
      date:
        type: string
      description:
        minLength: 1
        type: string
      lines:
        items:
          $ref: '#/definitions/request.JournalLineRequest'
        minItems: 2
        type: array
    required:
    - date
    - description
    - lines
    type: object
  request.JournalEntryUpdateRequest:
    properties:
      date:
        type: string
      description:
        minLength: 1
        type: string
      lines:
        items:
          $ref: '#/definitions/request.JournalLineRequest'
        minItems: 2
        type: array
    required:
    - date
    - description
    - lines
    type: object
  request.JournalLineRequest:
    properties:
      coa_id:
        type: string
      credit:
        minimum: 0
        type: number
      debit:
        minimum: 0
        type: number
      description:
        minLength: 1
        type: string
    required:
    - coa_id
    - description
    type: object
  request.LoginRequest:
    properties:
      email:
        example: johndoe@example.com
        maxLength: 20
        minLength: 1
        type: string
      password:
        example: yoursecretpassword
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  request.UserCreateRequest:
    properties:
      email:
        minLength: 1
        type: string
      name:
        minLength: 1
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 20
        minLength: 1
        type: string
    required:
    - email
    - name
    - password
    - username
    type: object
  request.UserUpdateRequest:
    properties:
      email:
        minLength: 1
        type: string
      id:
        type: string
      name:
        maxLength: 20
        minLength: 1
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 20
        minLength: 1
        type: string
    required:
    - email
    - name
    - username
    type: object
  request.VendorCreateRequest:
    properties:
      address:
        type: string
      coa_id:
        type: string
      code:
        maxLength: 20
        minLength: 1
        type: string
      email:
        type: string
      name:
        minLength: 1
        type: string
      phone:
        type: string
    required:
    - code
    - name
    type: object
  request.VendorUpdateRequest:
    properties:
      address:
        type: string
      coa_id:
        type: string
      code:
        maxLength: 20
        minLength: 1
        type: string
      email:
        type: string
      name:
        minLength: 1
        type: string
      phone:
        type: string
    required:
    - code
    - name
    type: object
  response.AuthJSON:
    properties:
      access_token:
        type: string
      message:
        type: string
      status:
        type: integer
      user:
        $ref: '#/definitions/response.UserInfo'
    type: object
  response.JSON:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/response.Meta'
      status:
        type: integer
    type: object
  response.Links:
    properties:
      current_page:
        type: string
      first_page:
        type: string
      last_page:
        type: string
      next_page:
        type: string
      prev_page:
        type: string
    type: object
  response.Meta:
    properties:
      info:
        type: string
      links:
        $ref: '#/definitions/response.Links'
      page:
        type: integer
      page_size:
        type: integer
      search:
        type: string
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
  response.SelectJSON:
    properties:
      data: {}
    type: object
  response.UserInfo:
    properties:
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
      status:
        type: integer
      username:
        type: string
    type: object
host: 127.0.0.1:3000
info:
  contact:
    email: fatihrizqon@gmail.com
    name: Fatih Rizqon
  description: This is an Official Documentation for Go REST API with Fiber Framework
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Go REST API with Fiber Framework
